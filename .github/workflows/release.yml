name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name, for example v2.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  PROJECT: ShiroBot.Adapter.Milky.csproj
  PUBLISH_DIR: bin/Release/net10.0/publish

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish "$PROJECT" --configuration Release

      - name: Package adapter
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_DLL="$PUBLISH_DIR/ShiroBot.Adapter.Milky.dll"
          if [ ! -f "$PLUGIN_DLL" ]; then
            echo "Adapter DLL not found: $PLUGIN_DLL"
            ls -la "$PUBLISH_DIR"
            exit 1
          fi
          mkdir -p release/stage
          cp "$PLUGIN_DLL" release/stage/
          [ -f "$PUBLISH_DIR/ShiroBot.Adapter.Milky.pdb" ] && cp "$PUBLISH_DIR/ShiroBot.Adapter.Milky.pdb" release/stage/ || true
          for shared in ShiroBot.SDK.dll ShiroBot.Model.QQ.dll ShiroBot.Model.Discord.dll ShiroBot.Model.Telegram.dll; do
            rm -f "release/stage/$shared"
          done
          (cd release/stage && zip -j ../ShiroBot.Adapter.Milky.zip ./*)

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/ShiroBot.Adapter.Milky.zip
