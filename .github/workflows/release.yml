name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name, for example v2.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  PROJECT_FILE: ShiroBot.Adapter.Milky.csproj
  TEST_PROJECT: tests/ShiroBot.MilkyAdapter.Tests/ShiroBot.MilkyAdapter.Tests.csproj
  PUBLISH_DIR: artifacts/publish
  ShiroBotSourceRoot: ${{ github.workspace }}/shirobot-host

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout host contracts
        uses: actions/checkout@v4
        with:
          repository: ShirokaProject/ShiroBot
          ref: v0.9.9
          path: shirobot-host

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "$TEST_PROJECT"

      - name: Test
        run: >-
          dotnet test "$TEST_PROJECT" --configuration Release --no-restore
          -p:CopyAdapterToHost=false -p:ShiroBotPluginPackagingEnabled=false

      - name: Publish
        run: >-
          dotnet publish "$PROJECT_FILE" --configuration Release
          --output "$PUBLISH_DIR"
          -p:CopyAdapterToHost=false -p:ShiroBotPluginPackagingEnabled=true

      - name: Package adapter
        shell: bash
        run: |
          set -euo pipefail
          ADAPTER_DLL="$PUBLISH_DIR/ShiroBot.Adapter.Milky.dll"
          if [ ! -f "$ADAPTER_DLL" ]; then
            echo "Adapter DLL not found: $ADAPTER_DLL"
            ls -la "$PUBLISH_DIR"
            exit 1
          fi
          test ! -f "$PUBLISH_DIR/ShiroBot.Adapter.Milky.Model.dll"
          mkdir -p release/stage
          cp "$ADAPTER_DLL" release/stage/
          (cd release/stage && zip -j ../ShiroBot.Adapter.Milky.zip ShiroBot.Adapter.Milky.dll)

      - name: Verify packaged adapter in isolation
        run: >-
          dotnet run --project tests/ShiroBot.MilkyPackageProbe --configuration Release
          -- release/ShiroBot.Adapter.Milky.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/ShiroBot.Adapter.Milky.zip
